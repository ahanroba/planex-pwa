    (function nukeCache() {
      try {
        var CACHE_FLAG = 'app_cache_busted_v1';
        var SESSION_FLAG = 'nuke_cache_attempted';

        var isLocalStorageDone = false;
        try {
          isLocalStorageDone = typeof localStorage !== 'undefined' && !!localStorage.getItem(CACHE_FLAG);
        } catch (e) {}

        var isSessionDone = false;
        try {
          isSessionDone = typeof sessionStorage !== 'undefined' && !!sessionStorage.getItem(SESSION_FLAG);
        } catch (e) {}

        if (isLocalStorageDone || isSessionDone) {
          return;
        }

        try { if (typeof localStorage !== 'undefined') localStorage.setItem(CACHE_FLAG, 'true'); } catch (e) {}
        try { if (typeof sessionStorage !== 'undefined') sessionStorage.setItem(SESSION_FLAG, 'true'); } catch (e) {}

        var hadWorkers = false;
        var hadCaches = false;

        var unregisterSW = (typeof navigator !== 'undefined' && 'serviceWorker' in navigator && typeof navigator.serviceWorker.getRegistrations === 'function')
          ? navigator.serviceWorker.getRegistrations().then(function(regs) {
              if (regs && regs.length > 0) {
                hadWorkers = true;
                return Promise.all(regs.map(function(r) { return r.unregister(); }));
              }
            }).catch(function(err) { console.warn('[NukeCache] SW error:', err); })
          : Promise.resolve();

        var clearCaches = (typeof window !== 'undefined' && 'caches' in window && typeof caches.keys === 'function')
          ? caches.keys().then(function(keys) {
              if (keys && keys.length > 0) {
                hadCaches = true;
                return Promise.all(keys.map(function(k) { return caches.delete(k); }));
              }
            }).catch(function(err) { console.warn('[NukeCache] Cache error:', err); })
          : Promise.resolve();

        Promise.all([unregisterSW, clearCaches]).finally(function() {
          if (hadWorkers || hadCaches) {
            console.log('[NukeCache] Cleaned stale workers/caches. Reloading once...');
            window.location.reload();
          }
        });
      } catch (e) {
        console.error('[NukeCache] Error:', e);
      }
    })();

    });
