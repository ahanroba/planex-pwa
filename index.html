  <script>
    // Immediate Telegram WebApp initialization to eliminate blank screen delay
    (function() {
      if (window.Telegram && window.Telegram.WebApp) {
        try {
          window.Telegram.WebApp.ready();
          window.Telegram.WebApp.expand();
        } catch (e) {
          console.warn('[Telegram WebApp] Init warning:', e);
        }
      }
    })();

    // Immediate Nuke Cache & Service Worker Cleanup for iOS Safari / Stale SW
    (function nukeCache() {
      try {
        var CACHE_FLAG = 'app_cache_busted_v1';
        if (typeof localStorage !== 'undefined' && !localStorage.getItem(CACHE_FLAG)) {
          localStorage.setItem(CACHE_FLAG, 'true');

          var unregisterSW = (typeof navigator !== 'undefined' && 'serviceWorker' in navigator && typeof navigator.serviceWorker.getRegistrations === 'function')
            ? navigator.serviceWorker.getRegistrations().then(function(regs) {
                return Promise.all(regs.map(function(r) { return r.unregister(); }));
              }).catch(function(err) { console.warn('[NukeCache] SW error:', err); })
            : Promise.resolve();

          var clearCaches = (typeof window !== 'undefined' && 'caches' in window && typeof caches.keys === 'function')
            ? caches.keys().then(function(keys) {
                return Promise.all(keys.map(function(k) { return caches.delete(k); }));
              }).catch(function(err) { console.warn('[NukeCache] Cache error:', err); })
            : Promise.resolve();

          Promise.all([unregisterSW, clearCaches]).finally(function() {
            console.log('[NukeCache] Reloading...');
            window.location.reload(true);
          });
        }
      } catch (e) {
        console.error('[NukeCache] Error:', e);
      }
    })();

    // Lightweight error handler to prevent screen freeze
    window.addEventListener('error', function (e) {
      console.error('[Global Error]', e.message || e, e.error);
    });
    window.addEventListener('unhandledrejection', function (e) {
      console.error('[Global Promise Error]', e.reason);
    });
  </script>
